<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Obrigado | LaborIA Academy</title>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Lora:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --bg: #faf9f5;
            --heading: #0b101a;
            --text: #1a1f2e;
            --blue: #1d5bd6;
            --green: #0b6e4f;
            --shadow: 0 8px 28px rgba(11, 16, 26, 0.06), 0 2px 8px rgba(11, 16, 26, 0.03);
            --font-serif: 'Lora', 'Georgia', serif;
            --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
        }
        * { box-sizing: border-box; margin: 0; }
        body {
            font-family: var(--font-serif);
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-image:
                linear-gradient(rgba(100, 116, 139, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(100, 116, 139, 0.04) 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .card {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(18px);
            border: 1px solid #d8dfe9;
            border-radius: 24px;
            padding: 3rem 2.5rem;
            max-width: 560px;
            text-align: center;
            box-shadow: var(--shadow);
        }
        .logo {
            width: 80px;
            margin: 0 auto 1.5rem;
            display: block;
        }
        h1 {
            font-family: var(--font-serif);
            color: var(--heading);
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--heading);
            color: #fff;
            text-decoration: none;
            padding: 1rem 1.8rem;
            border-radius: 12px;
            font-family: var(--font-mono);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            font-size: 0.8rem;
            transition: background 0.3s ease, transform 0.2s ease;
            margin: 0.5rem;
        }
        .btn:hover {
            background: var(--blue);
            transform: translateY(-2px);
        }
        .link-copy {
            margin-top: 1.5rem;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: #5a6578;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="Logo.png" alt="LaborIA Academy" class="logo" />
        <h1>📖 Material liberado!</h1>
        <p>Seu interesse foi registrado com sucesso.<br>O e-book <strong>"O Cérebro Digital"</strong> já está disponível para você.</p>
        <a href="ebook0.html" class="btn">Acessar o e-book agora</a>
        <p style="margin-top: 1.5rem; font-size:0.9rem;">Guarde também este link direto:</p>
        <p class="link-copy">https://souzafcb.github.io/LaborIA/ebook0.html</p>
    </div>
</body>
</html>
